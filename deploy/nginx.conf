# Only students on the lab network reach this; it's still configured as if
# it faced the internet, because the people on that network are learning to attack.

limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

server {
    listen 80 default_server;
    server_name netsec.internal;

    # Served over plain HTTP on purpose: students need it *before* they trust
    # anything. They verify it by fingerprint (Lab 0).
    location = /ca.crt {
        alias /usr/share/nginx/ca/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name netsec.internal;

    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 5m;

    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /ca.crt {
        alias /usr/share/nginx/ca/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location = /accounts/login/ {
        limit_req zone=login burst=30 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
